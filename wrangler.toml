name = "support-saas"
main = "edge-worker.mjs"
# edge-worker.mjs wraps the generated .open-next/worker.js (rate limiting +
# public error redaction, see lib/edgeGuard.mjs).
compatibility_date = "2026-05-12"
compatibility_flags = ["nodejs_compat"]

# Content generation and AI fallback chains can exhaust the default
# subrequest limit of 1,000 quickly. Increase to 5,000 for headroom.
# [limits]
#   subrequests = 5000  # uncomment when upgrading to Paid plan
# (Free Workers plan rejects any [limits] block)

[build]
command = "npx opennextjs-cloudflare build --openNextConfigPath open-next.cloudflare.config.ts"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Independent append-only privacy checkpoint state. The signing key, trust
# manifest, bootstrap capability, and approved enrollment tuples are provisioned
# as Worker secrets/vars outside source control. No tenant is seeded here.
[[durable_objects.bindings]]
name = "Q02_CHECKPOINTS"
class_name = "Q02CheckpointJournal"

[[migrations]]
tag = "q02-checkpoints-v1"
new_sqlite_classes = ["Q02CheckpointJournal"]

# Rate limiting (Sanitization Brief Phase 5): native Workers Rate Limiting,
# enforced in lib/edgeGuard.mjs, keyed `<bucket>:<client IP>` per location.
[[ratelimits]]
name = "RL_WIDGET"
namespace_id = "73301"
simple = { limit = 15, period = 60 }

[[ratelimits]]
name = "RL_TRANSLATE"
namespace_id = "73302"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "RL_STAFF"
namespace_id = "73303"
simple = { limit = 120, period = 60 }

[vars]
CLERK_AUTHORIZED_PARTIES = "https://support.yousafeconsultancy.com"
NEXT_PUBLIC_CLERK_JS_VERSION = "6.32.0"
NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY = "pk_live_Y2xlcmsucG9ydGFsLnlvdXNhZmVjb25zdWx0YW5jeS5jb20k"
