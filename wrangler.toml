name = "support-saas"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[build]
command = "npx opennextjs-cloudflare build --openNextConfigPath open-next.cloudflare.config.ts"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
CLERK_AUTHORIZED_PARTIES = "https://portal.yousafeconsultancy.com,https://support.yousafeconsultancy.com"

[[routes]]
pattern = "support.yousafeconsultancy.com"
custom_domain = true
