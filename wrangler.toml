# Server-side secrets (NEVER commit these — set via `wrangler secret put` in CI/CF dashboard):
#   CLERK_SECRET_KEY
#   CLERK_WEBHOOK_SECRET
#   SUPABASE_SERVICE_ROLE_KEY
#   CHECKPOINT_SIGNING_JWK (private ES256 JWK; never source or logs)
#   CHECKPOINT_ADMIN_CAPABILITY (bootstrap only)
#   CHECKPOINT_TRUST (public ES256 trust manifest JSON)
#   CHECKPOINT_ENROLLMENTS (approved tenant/generation/genesis JSON tuples)

[[routes]]
